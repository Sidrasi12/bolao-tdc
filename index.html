<html lang="pt-BR">

  <meta charset="utf-8">

    content="width=device-width, initial-scale=1"

<body>
  <div
    id="toast"
    class="toast">
  </div>

  <!-- Tela de login -->
  <section
    id="auth-view"
    class="auth-shell">

    <div class="auth-card">
      <div class="ball">🏈</div>

      <h1>
        Bolão NFL TDC
        <span>2026</span>
      </h1>

      <p>
        Palpites, ranking e resenha em um só lugar.
      </p>

      <form id="login-form">
        <label>
          E-mail

          <input
            id="email"
            type="email"
            autocomplete="email"
            required
          >
        </label>

        <label>
          Senha

          <input
            id="password"
            type="password"
            autocomplete="current-password"
            minlength="6"
            required
          >
        </label>

        <button type="submit">
          Entrar
        </button>
      </form>

      <div class="auth-actions">
        <button
          type="button"
          class="secondary"
          id="register-btn">
          Criar conta
        </button>

        <button
          type="button"
          class="link-button"
          id="forgot-btn">
          Esqueci minha senha
        </button>
      </div>

      <small>
        Uso privado entre participantes cadastrados.
      </small>
    </div>
  </section>

  <!-- Tela de criação de conta -->
  <section
    id="register-view"
    class="auth-shell hidden">

    <div class="auth-card">
      <div class="ball">🏈</div>

      <h1>
        Criar conta
      </h1>

      <p>
        Informe seus dados para participar do bolão.
      </p>

      <form id="register-form">
        <label>
          Nome pelo qual gostaria de ser chamado

          <input
            id="register-name"
            type="text"
            autocomplete="name"
            maxlength="40"
            required
          >
        </label>

        <label>
          E-mail

          <input
            id="register-email"
            type="email"
            autocomplete="email"
            required
          >
        </label>

        <label>
          Senha

          <input
            id="register-password"
            type="password"
            autocomplete="new-password"
            minlength="6"
            required
          >
        </label>
