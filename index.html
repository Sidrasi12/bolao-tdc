<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071b14">
  <title>Bolão TDC</title>
  <link rel="stylesheet" href="css/style.css">
  <script defer src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <div id="toast" class="toast"></div>
  
  <section id="auth-view" class="auth-shell">
    <div class="auth-card">
      <div class="ball">🏈</div>
      <h1>Bolão <span>TDC</span></h1>
      <p>Palpites, ranking e resenha em um só lugar.</p>
      <form id="login-form">
        <label>E-mail<input id="email" type="email" autocomplete="email" required></label>
        <label>Senha<input id="password" type="password" autocomplete="current-password" required minlength="6"></label>
        <button type="submit">Entrar</button>
      </form>
      <div class="auth-actions">
        <button type="button" class="secondary" id="register-btn">Criar conta</button>
        <button type="button" class="link-button" id="forgot-btn">Esqueci minha senha</button>
      </div>
      <small>Uso privado entre participantes cadastrados.</small>
    </div>
  </section>

  <section id="register-view" class="auth-shell hidden">
    <div class="auth-card">
      <div class="ball">🏈</div>
      <h1>Criar conta</h1>
      <p>Informe seus dados para participar do bolão.</p>
      <form id="register-form">
        <label>Nome pelo qual gostaria de ser chamado<input id="register-name" type="text" autocomplete="name" maxlength="40" required></label>
        <label>E-mail<input id="register-email" type="email" autocomplete="email" required></label>
        <label>Senha<input id="register-password" type="password" autocomplete="new-password" minlength="6" required></label>
        <label>Confirmar senha<input id="register-confirm" type="password" autocomplete="new-password" minlength="6" required></label>
        <button type="submit">Concluir cadastro</button>
      </form>
      <button type="button" class="secondary full-button" id="back-login-btn">Voltar ao login</button>
    </div>
  </section>

  <section id="reset-view" class="auth-shell hidden">
    <div class="auth-card">
      <div class="ball">🔑</div>
      <h1>Recuperar senha</h1>
      <p>Enviaremos um link de redefinição para o e-mail cadastrado.</p>
      <form id="reset-form">
        <label>E-mail<input id="reset-email" type="email" autocomplete="email" required></label>
        <button type="submit">Enviar link de recuperação</button>
      </form>
      <button type="button" class="secondary full-button" id="back-reset-btn">Voltar ao login</button>
    </div>
  </section>

  <div id="app" class="hidden">
    <header>
      <button id="menu-btn" class="icon-btn">☰</button>
      <div class="brand">🏈 <b>Bolão TDC</b></div>
      <div class="user">
        <span id="user-name"></span>
        <button id="logout-btn" class="secondary compact">Sair</button>
      </div>
    </header>
    <aside>
      <nav>
        <button data-page="dashboard" class="active">⌂ Início</button>
        <button data-page="weekly">✓ Palpites semanais</button>
        <button data-page="preseason">★ Pré-temporada</button>
        <button data-page="ranking">🏆 Ranking</button>
        <button data-page="regulation">▤ Regulamento</button>
        <button data-page="profile">👤 Meu cadastro</button>
        <button data-page="admin" class="admin-only">⚙ Administração</button>
      </nav>
    </aside>
    <main id="content"></main>
    <footer>Bolão TDC · Uso privado entre amigos</footer>
  </div>

  <script defer src="js/firebase-config.js"></script>
  <script defer src="js/nfl-teams.js"></script>
  <script defer src="js/espn-api.js"></script>
  <script defer src="js/scoring.js"></script>
  <script defer src="js/auth.js"></script>
  <script defer src="js/predictions.js"></script>
  <script defer src="js/finance.js"></script>
  <script defer src="js/ranking.js"></script>
  <script defer src="js/dashboard.js"></script>
  <script defer src="js/regulation.js"></script>
  <script defer src="js/profile.js"></script>
  <script defer src="js/admin.js"></script>
  <script defer src="js/app.js"></script>
</body>
</html>
